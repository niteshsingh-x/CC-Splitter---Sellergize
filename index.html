<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Splitter Tool</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --input-bg: #090d16;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin-top: 40px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #ffffff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        .output-group {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .person-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .person-title {
            font-weight: bold;
            color: #ffffff;
        }

        .range-highlight {
            font-weight: bold;
            color: var(--accent-color);
        }

        .count-highlight {
            color: #8b949e;
            font-size: 14px;
        }

        .error {
            color: #f85149;
            background-color: rgba(248, 81, 73, 0.1);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(248, 81, 73, 0.4);
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Number Splitter</h1>
    
    <div class="input-group">
        <label for="numberInput">Enter numbers (e.g., "106 6", "6/106", "106 6 217440"):</label>
        <input type="text" id="numberInput" placeholder="Type here..." autocomplete="off" autofocus>
    </div>

    <div id="errorMessage" class="error"></div>
    <div id="output" class="output-group"></div>
</div>

<script>
    const inputEl = document.getElementById('numberInput');
    const outputEl = document.getElementById('output');
    const errorEl = document.getElementById('errorMessage');

    inputEl.addEventListener('input', calculateSplit);

    function calculateSplit() {
        const rawValue = inputEl.value.trim();
        outputEl.innerHTML = '';
        errorEl.style.display = 'none';

        if (!rawValue) return;

        // Extract numbers using a regex that looks for groups of digits
        const numbers = rawValue.replace(/\//g, ' ').match(/\d+/g);

        if (!numbers || numbers.length < 2) {
            return; // Not enough numbers to calculate yet
        }

        let totalNumbers = 0;
        let peopleCount = 0;
        let serialNumber = 1; // Default starting number

        const num1 = parseInt(numbers[0], 10);
        const num2 = parseInt(numbers[1], 10);

        // Figure out which is total numbers and which is people based on lower value rule
        if (num1 <= num2) {
            peopleCount = num1;
            totalNumbers = num2;
        } else {
            peopleCount = num2;
            totalNumbers = num1;
        }

        // Check if there is a 3rd number (the 6-digit serial number)
        if (numbers.length >= 3) {
            serialNumber = parseInt(numbers[2], 10);
        }

        if (peopleCount <= 0 || totalNumbers <= 0) {
            showError("Values must be greater than zero.");
            return;
        }

        if (peopleCount > totalNumbers) {
            showError("People count cannot be greater than the total number pool.");
            return;
        }

        // Logic to distribute numbers evenly
        let baseCount = Math.floor(totalNumbers / peopleCount);
        let remainder = totalNumbers % peopleCount;

        let currentStart = serialNumber;

        for (let i = 1; i <= peopleCount; i++) {
            // Give extra numbers to the first few people to handle remainder cleanly
            let countForThisPerson = baseCount + (i <= remainder ? 1 : 0);
            let currentEnd = currentStart + countForThisPerson - 1;

            const card = document.createElement('div');
            card.className = 'person-card';
            card.innerHTML = `
                <span class="person-title">person ${i}</span> = 
                <span class="range-highlight">${currentStart} to ${currentEnd}</span> 
                <span class="count-highlight">(${countForThisPerson} numbers)</span>
            `;
            outputEl.appendChild(card);

            currentStart = currentEnd + 1;
        }
    }

    function showError(msg) {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
    }
</script>

</body>
</html>
