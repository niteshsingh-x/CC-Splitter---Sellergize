<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Splitter Tool</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --input-bg: #090d16;
            --success-color: #3fb950;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin-top: 40px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
            color: #ffffff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        input {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #ffffff;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.3);
        }

        .output-group {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .person-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .card-content {
            flex-grow: 1;
        }

        .person-title {
            font-weight: bold;
            color: #ffffff;
        }

        .range-highlight {
            font-weight: bold;
            color: var(--accent-color);
        }

        .count-highlight {
            color: #8b949e;
            font-size: 14px;
        }

        .copy-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }

        .copy-btn.copied {
            background-color: rgba(63, 185, 80, 0.1);
            border-color: var(--success-color);
            color: var(--success-color);
        }

        .error {
            color: #f85149;
            background-color: rgba(248, 81, 73, 0.1);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid rgba(248, 81, 73, 0.4);
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Number Splitter</h1>
    
    <div class="input-group">
        <label for="numberInput">Enter numbers (e.g., "106 6", "6/106", "106 6 217440"):</label>
        <input type="text" id="numberInput" placeholder="Type here..." autocomplete="off" autofocus>
    </div>

    <div id="errorMessage" class="error"></div>
    <div id="output" class="output-group"></div>
</div>

<script>
    const inputEl = document.getElementById('numberInput');
    const outputEl = document.getElementById('output');
    const errorEl = document.getElementById('errorMessage');

    inputEl.addEventListener('input', calculateSplit);

    function calculateSplit() {
        const rawValue = inputEl.value.trim();
        outputEl.innerHTML = '';
        errorEl.style.display = 'none';

        if (!rawValue) return;

        // Clean out slashes and match groups of sequential digits
        const parsedTokens = rawValue.replace(/\//g, ' ').match(/\d+/g);

        if (!parsedTokens || parsedTokens.length < 2) {
            return; 
        }

        // Convert tokens to integers
        const values = parsedTokens.map(v => parseInt(v, 10));

        let serialNumber = 1;
        let baseNumbers = [];

        // Check if one of the values is a 6-digit serial number
        const serialIndex = values.findIndex(v => v.toString().length === 6);

        if (serialIndex !== -1) {
            serialNumber = values[serialIndex];
            // Remove the serial number from the values array so we only have total items and people count remaining
            baseNumbers = values.filter((_, idx) => idx !== serialIndex);
        } else {
            baseNumbers = values;
        }

        if (baseNumbers.length < 2) return;

        let totalNumbers = 0;
        let peopleCount = 0;

        const num1 = baseNumbers[0];
        const num2 = baseNumbers[1];

        // Apply our core rule: The lower number is always the number of people
        if (num1 <= num2) {
            peopleCount = num1;
            totalNumbers = num2;
        } else {
            peopleCount = num2;
            totalNumbers = num1;
        }

        if (peopleCount <= 0 || totalNumbers <= 0) {
            showError("Values must be greater than zero.");
            return;
        }

        if (peopleCount > totalNumbers) {
            showError("People count cannot be greater than the total number pool.");
            return;
        }

        // Standard sequence layout distribution logic
        let baseCount = Math.floor(totalNumbers / peopleCount);
        let remainder = totalNumbers % peopleCount;

        let currentStart = serialNumber;

        for (let i = 1; i <= peopleCount; i++) {
            let countForThisPerson = baseCount + (i <= remainder ? 1 : 0);
            let currentEnd = currentStart + countForThisPerson - 1;

            const textToCopy = `person ${i} = ${currentStart} to ${currentEnd} (${countForThisPerson} numbers)`;

            const card = document.createElement('div');
            card.className = 'person-card';
            
            card.innerHTML = `
                <div class="card-content">
                    <span class="person-title">person ${i}</span> = 
                    <span class="range-highlight">${currentStart} to ${currentEnd}</span> 
                    <span class="count-highlight">(${countForThisPerson} numbers)</span>
                </div>
                <button class="copy-btn">Copy</button>
            `;

            // Add copy button logic
            const copyBtn = card.querySelector('.copy-btn');
            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    copyBtn.textContent = 'Copied!';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.textContent = 'Copy';
                        copyBtn.classList.remove('copied');
                    }, 2000);
                });
            });

            outputEl.appendChild(card);

            currentStart = currentEnd + 1;
        }
    }

    function showError(msg) {
        errorEl.textContent = msg;
        errorEl.style.display = 'block';
    }
</script>

</body>
</html>
